source = $HOME/.config/hypr/mocha.conf

$font = Hack Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/images/nordicwallpaper.webp
    blur_passes = 2
}

# TIME (Clock) - White (use foreground color from mocha)
label {
    monitor =
    text = cmd[update:10] echo "$(date +"%R")"
    color = $borderLock
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE - Foreground from mocha
label {
    monitor = 
    text = cmd[update:10] echo "$(date +"%A, %d %B %Y")"
    color = $borderLock
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "$($HOME/.config/hypr/custom_modules/hyprlock_spotify.sh)" 
    color = $borderLock
    font_size = 25
    font_family = $font
    position = -30, -200
    halign = right
    valign = top
}


image {
    monitor = 
    path = ~/.face
    size = 100
    border_color = $backgroundLock
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)  # Example: semi-transparent black
    inner_color = $backgroundLock
    font_color = $borderLock
    fade_on_empty = false
    placeholder_text = <span foreground="##$borderAlpha1"><i>󰌾 Logged in as </i><span foreground="##$borderAlpha2">$USER</span></span>
    hide_input = false
    check_color = $backgroundLock
    fail_color = rgba(255, 34, 34, 1.0)   # Example: red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(255, 255, 0, 1.0)  # Example: yellow
    position = 0, -35
    halign = center
    valign = center
}
